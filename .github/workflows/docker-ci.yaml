name: Docker CI/CD Pipeline

on:
  push: 
    branches:
      - "main"
      
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Login Docker Hub
      - name: Login to Docker Hub
        # uses: docker/login-action@v3
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        
      # # 3. Build Docker Image
      # - name: Build Docker Image
      #   env:
      #     DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      #   run: |
      #     docker build \
      #     --no-cache \
      #     -t $DOCKER_USERNAME/chat-app:latest \
      #     -f ./docker/Dockerfile .
      
      # # 4. Push Docker Image
      # - name: Push Docker Image
      #   env:
      #     DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      #   run : |
      #     docker push $DOCKER_USERNAME/chat-app:latest
      
      # 3. Khởi tạo Docker Buildx (Bắt buộc để chạy Action Build mới giúp quản lý cache chuẩn)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      # 4. Build và Push tự động bằng Action chính chủ của Docker
      - name: Build and Push Docker Image
        uses: docker/build-push-action@ca2196b2077241a551571bf7bab8b9a113e31ae7 # v6.0.0
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/chat-app:latest
          # Dòng dưới đây ép buộc Docker xoá cache cũ xung đột và build sạch hoàn toàn ở lần này
          no-cache: true