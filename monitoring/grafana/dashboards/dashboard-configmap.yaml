apiVersion: v1
kind: ConfigMap

metadata:
  name: cluster-health-dashboard
  namespace: default
  labels:
    grafana_dashboard_chat_app: "1"

data:
  cluster-health.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Running Pods",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{phase=\"Running\"})"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Services Count",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "targets": [
            {
              "expr": "count(kube_service_info)"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Pod Restarts",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(kube_pod_container_status_restarts_total)"
            }
          ]
        },
        {
          "id": 4,
          "type": "gauge",
          "title": "Node CPU Usage %",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            {
              "expr": "(1-avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))*100",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "gauge",
          "title": "Node Memory Usage %",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            {
              "expr": "(1-(node_memory_MemAvailable_bytes/node_memory_MemTotal_bytes))*100",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "table",
          "title": "Pods Status",
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 12 },
          "targets": [
            {
              "expr": "kube_pod_status_phase{phase=\"Running\"}",
              "format": "table",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "table",
          "title": "Services",
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 12 },
          "targets": [
            {
              "expr": "kube_service_info",
              "format": "table",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "table",
          "title": "Pod Restart Detail",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 22 },
          "targets": [
            {
              "expr": "kube_pod_container_status_restarts_total",
              "format": "table",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": [
        "kubernetes",
        "monitoring"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Cluster Health Monitoring",
      "version": 1
    }